[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    slow: marks tests that run full experiments (excluded from CI by default)
    requires_api_key: tests that need OPENAI_API_KEY (skipped when unset)
filterwarnings =
    ignore::DeprecationWarning:sklearn.*
